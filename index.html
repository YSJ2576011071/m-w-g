<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 네온 스네이크 게임</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-green: #00ff66;
            --accent-red: #ff3366;
            --text-color: #e6edf3;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }

        .game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            margin-bottom: 15px;
            text-align: center;
        }

        .header h1 {
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .score-board {
            font-size: 1.2rem;
            color: #8b949e;
        }

        .score-board span {
            color: var(--accent-green);
            font-weight: bold;
        }

        canvas {
            border: 3px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            background-color: #000;
        }

        .leaderboard-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            width: 320px;
            display: flex;
            flex-direction: column;
        }

        .leaderboard-section h2 {
            color: var(--accent-green);
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .leaderboard-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 400px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .leaderboard-item.top3 {
            border-left: 3px solid var(--accent-green);
            background-color: rgba(0, 255, 102, 0.05);
        }

        .rank {
            font-weight: bold;
            color: var(--accent-green);
            width: 30px;
        }

        .player-name {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-score {
            font-weight: bold;
        }

        .controls-hint {
            margin-top: 15px;
            color: #8b949e;
            font-size: 0.85rem;
            text-align: center;
        }

        /* 모바일용 버추얼 패드 */
        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
            margin-top: 15px;
        }

        .touch-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        @media (max-width: 768px) {
            .touch-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 게임 영역 -->
    <div class="game-section">
        <div class="header">
            <h1>🐍 S N A K E</h1>
            <div class="score-board">SCORE: <span id="current-score">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="500" height="500"></canvas>
        
        <div class="controls-hint">방향키(↑, ↓, ←, →)로 뱀을 조종하세요!</div>

        <!-- 모바일 터치 컨트롤러 -->
        <div class="touch-controls">
            <div></div>
            <button class="touch-btn" onclick="changeDirection('up')">▲</button>
            <div></div>
            <button class="touch-btn" onclick="changeDirection('left')">◀</button>
            <button class="touch-btn" onclick="changeDirection('down')">▼</button>
            <button class="touch-btn" onclick="changeDirection('right')">▶</button>
        </div>
    </div>

    <!-- 실시간 리더보드 영역 -->
    <div class="leaderboard-section">
        <h2>🏆 실시간 랭킹</h2>
        <ul class="leaderboard-list" id="leaderboard">
            <li class="leaderboard-item">불러오는 중...</li>
        </ul>
    </div>
</div>

<!-- Firebase SDK (Firestore 모듈) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ [수정 필요] 본인의 Firebase 설정 정보를 아래에 넣어주세요 ⚠️
    const firebaseConfig = {
        apiKey: "AIzaSyBARegSC31rHoGcpBMGo94byQAsi0MQ4wk",
        authDomain: "web-game-890e0.firebaseapp.com",
        projectId: "web-game-890e0",
        storageBucket: "web-game-890e0.firebasestorage.app",
        messagingSenderId: "452900776702",
        appId: "1:452900776702:web:be07d1b1ba25eceef153af",
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ----------------------------------------------------
    // 게임 로직 (Python Tkinter 원본 로직 유지)
    // ----------------------------------------------------
    const GAME_WIDTH = 500;
    const GAME_HEIGHT = 500;
    const SPEED = 100;
    const SPACE_SIZE = 20;
    const BODY_PARTS = 4;
    const SNAKE_COLOR = "#00FF00";
    const FOOD_COLOR = "#FF0000";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreLabel = document.getElementById("current-score");

    let score = 0;
    let direction = 'down';
    let snake = [];
    let food = { x: 0, y: 0 };
    let gameInterval = null;
    let isGameOver = false;

    function initGame() {
        score = 0;
        direction = 'down';
        isGameOver = false;
        scoreLabel.textContent = score;

        // 뱀 초기화
        snake = [];
        for (let i = 0; i < BODY_PARTS; i++) {
            snake.push({ x: 0, y: 0 });
        }

        spawnFood();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(nextTurn, SPEED);
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * (GAME_WIDTH / SPACE_SIZE)) * SPACE_SIZE;
        food.y = Math.floor(Math.random() * (GAME_HEIGHT / SPACE_SIZE)) * SPACE_SIZE;
    }

    function nextTurn() {
        if (isGameOver) return;

        let headX = snake[0].x;
        let headY = snake[0].y;

        if (direction === "up") headY -= SPACE_SIZE;
        else if (direction === "down") headY += SPACE_SIZE;
        else if (direction === "left") headX -= SPACE_SIZE;
        else if (direction === "right") headX += SPACE_SIZE;

        // 새로운 머리 위치 추가
        snake.unshift({ x: headX, y: headY });

        // 먹이 먹음 확인
        if (headX === food.x && headY === food.y) {
            score += 1;
            scoreLabel.textContent = score;
            spawnFood();
        } else {
            snake.pop(); // 먹지 않았으면 꼬리 제거
        }

        // 충돌 체크
        if (checkCollisions()) {
            handleGameOver();
        } else {
            draw();
        }
    }

    function checkCollisions() {
        const head = snake[0];

        // 벽 충돌
        if (head.x < 0 || head.x >= GAME_WIDTH || head.y < 0 || head.y >= GAME_HEIGHT) {
            return true;
        }

        // 자기 자신 충돌
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                return true;
            }
        }
        return false;
    }

    function draw() {
        // 배경 지우기
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 먹이 그리기
        ctx.fillStyle = FOOD_COLOR;
        ctx.beginPath();
        ctx.arc(food.x + SPACE_SIZE/2, food.y + SPACE_SIZE/2, SPACE_SIZE/2, 0, 2 * Math.PI);
        ctx.fill();

        // 뱀 그리기
        ctx.fillStyle = SNAKE_COLOR;
        snake.forEach(part => {
            ctx.fillRect(part.x, part.y, SPACE_SIZE, SPACE_SIZE);
        });
    }

    async function handleGameOver() {
        isGameOver = true;
        clearInterval(gameInterval);

        // 게임 오버 텍스트
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        ctx.fillStyle = "red";
        ctx.font = "40px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", GAME_WIDTH / 2, GAME_HEIGHT / 2);

        // 점수 등록 안내
        setTimeout(async () => {
            if (score > 0) {
                const playerName = prompt(`게임 오버! 당신의 점수는 ${score}점입니다.\n랭킹에 등록할 이름을 입력하세요:`, "익명 플레이어");
                if (playerName) {
                    await saveScore(playerName, score);
                }
            }
            if (confirm("다시 시작하시겠습니까?")) {
                initGame();
            }
        }, 100);
    }

    window.changeDirection = function(newDirection) {
        if (newDirection === 'left' && direction !== 'right') direction = newDirection;
        else if (newDirection === 'right' && direction !== 'left') direction = newDirection;
        else if (newDirection === 'up' && direction !== 'down') direction = newDirection;
        else if (newDirection === 'down' && direction !== 'up') direction = newDirection;
    };

    // 키보드 이벤트
    window.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") changeDirection('left');
        else if (e.key === "ArrowRight") changeDirection('right');
        else if (e.key === "ArrowUp") changeDirection('up');
        else if (e.key === "ArrowDown") changeDirection('down');
    });

    // ----------------------------------------------------
    // Firebase Firestore 리더보드 연동 함수
    // ----------------------------------------------------
    
    // 점수 저장
    async function saveScore(name, playerScore) {
        try {
            await addDoc(collection(db, "leaderboard"), {
                name: name.trim() || "익명",
                score: playerScore,
                timestamp: new Date()
            });
        } catch (e) {
            console.error("점수 저장 실패:", e);
        }
    }

    // 실시간 순위표 수신 (상위 10개 점수)
    const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
    onSnapshot(q, (snapshot) => {
        const leaderboardList = document.getElementById("leaderboard");
        leaderboardList.innerHTML = "";

        if (snapshot.empty) {
            leaderboardList.innerHTML = '<li class="leaderboard-item">등록된 점수가 없습니다.</li>';
            return;
        }

        let rank = 1;
        snapshot.forEach((doc) => {
            const data = doc.data();
            const li = document.createElement("li");
            li.className = `leaderboard-item ${rank <= 3 ? 'top3' : ''}`;
            
            li.innerHTML = `
                <span class="rank">${rank}위</span>
                <span class="player-name">${data.name}</span>
                <span class="player-score">${data.score}점</span>
            `;
            leaderboardList.appendChild(li);
            rank++;
        });
    });

    // 게임 시작
    initGame();
</script>

</body>
</html>
